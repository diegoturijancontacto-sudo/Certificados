<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificados · RTBROK</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #070a0e;
    --side: #080b10;
    --paper: #0d1117;
    --plate: #090d12;
    --ink: #f4f4f5;
    --muted: #a5afbd;
    --line: #1a2029;
    --line-strong: #252a33;
    --gold: #a97836;
    --gold-line: #bd904e;
    --seal: #10c89b;
    --seal-bg: #0b2a27;
    --error: #fb4562;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
  }

  /* ===== Barra lateral ===== */
  .sidebar {
    position: sticky; top: 0; align-self: flex-start;
    width: 220px; height: 100vh; flex: none;
    display: flex; flex-direction: column; gap: 10px;
    padding: 20px 12px;
    background: var(--side);
    border-right: 1px solid #1b2028;
    z-index: 20;
  }
  .side-brand {
    display: flex; align-items: center; justify-content: center;
    padding: 4px 2px 14px;
  }
  .side-brand img { display: block; width: 100%; height: auto; max-height: 64px; object-fit: contain; object-position: center; }
  .nav { display: flex; flex-direction: column; gap: 10px; }
  .nav a {
    display: flex; align-items: center; gap: 12px;
    min-height: 48px; padding: 8px 10px;
    color: #d4d4d8; text-decoration: none; border-radius: 6px;
    border-left: 3px solid transparent;
    transition: background .15s ease, color .15s ease;
  }
  .nav a:hover { background: #171a20; color: #fff; }
  .nav a .ico { width: 30px; height: 30px; display: grid; place-items: center; flex: none; }
  .nav a .ico svg { width: 20px; height: 20px; }
  .nav a span.txt { font-size: 13px; font-weight: 500; letter-spacing: -.01em; }
  .nav a[aria-current="page"] {
    background: #171a20; color: #fff; border-left-color: var(--gold);
    cursor: default;
  }
  .nav a[aria-current="page"] .ico { color: #e4aa35; }

  /* ===== Contenido ===== */
  .content { flex: 1; min-width: 0; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 64px; }

  .topbar {
    display: flex; flex-wrap: wrap; gap: 16px;
    align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  .top-brand { display: none; }
  .top-brand img { display: block; max-height: 36px; width: auto; }

  .search { display: flex; gap: 8px; min-width: 320px; flex: 1; max-width: 520px; }
  .search input {
    flex: 1; min-width: 0;
    font: 500 .95rem var(--sans); letter-spacing: .08em; text-transform: uppercase;
    padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--paper); color: var(--ink);
  }
  .search input::placeholder { text-transform: none; letter-spacing: 0; color: #788493; font-weight: 400; }
  button, .btn {
    font: 600 .9rem var(--sans); cursor: pointer;
    padding: 11px 18px; border-radius: 6px; border: 1px solid var(--gold-line);
    background: var(--gold); color: #fff;
  }
  .btn-add {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font: 600 .9rem var(--sans); white-space: nowrap;
    padding: 11px 18px; border-radius: 6px;
    background: transparent; color: var(--ink); border: 1px solid var(--gold-line);
  }
  .btn-add svg { width: 16px; height: 16px; }
  .btn-add:hover { background: rgba(169,120,54,.18); }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  button:hover { filter: brightness(1.12); }
  button.ghost:hover { border-color: var(--ink); filter: none; }
  :focus-visible { outline: 3px solid var(--gold-line); outline-offset: 2px; }

  /* --- Resultado individual --- */
  .certificate {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 7px;
    box-shadow: 0 24px 48px -28px rgba(0,0,0,.8);
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    margin-bottom: 40px;
    overflow: hidden;
  }
  .plate { padding: 28px; background: var(--plate); border-right: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
  .plate figure { margin: 0; width: 100%; }
  .plate img {
    display: block; width: 100%; max-height: 640px; object-fit: contain;
    background: #fff; padding: 10px; border: 1px solid var(--line); border-radius: 4px;
  }
  .noimg { aspect-ratio: 4 / 5; display: grid; place-items: center; color: var(--muted); border: 1px dashed var(--line-strong); font-size: .95rem; text-align: center; padding: 12px; }

  .label { padding: 36px 36px 32px; display: flex; flex-direction: column; }
  .kicker { margin: 0; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #e4aa35; }
  h1 { font: 400 clamp(2rem, 4.4vw, 2.9rem)/1.08 var(--serif); margin: 8px 0 4px; letter-spacing: -.01em; color: #fff; }
  .autor { font: italic 400 1.35rem var(--serif); margin: 0 0 24px; color: var(--ink); }

  dl { margin: 0; border-top: 1px solid var(--line); }
  dl div { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  dt { color: var(--muted); font-size: .88rem; }
  dd { margin: 0; font-weight: 500; }

  .seal { margin-top: auto; padding-top: 28px; }
  .seal-box {
    display: flex; gap: 14px; align-items: center;
    background: var(--seal-bg); border: 1.5px solid var(--seal); border-radius: 6px;
    padding: 14px 16px; color: var(--seal);
  }
  .seal-box svg { flex: none; }
  .seal-box strong { display: block; font-weight: 600; }
  .id {
    display: block; margin-top: 2px; color: var(--ink);
    font: 600 1.2rem var(--sans); letter-spacing: .14em; font-variant-numeric: tabular-nums;
    word-break: break-all;
  }

  /* --- Catálogo --- */
  .catalog-head {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 8px; margin: 8px 0 20px;
    border-bottom: 1px solid var(--line); padding-bottom: 12px;
  }
  .catalog-head h2 { font: 400 1.9rem var(--serif); margin: 0; color: #fff; }
  .catalog-head .count { color: var(--muted); font-size: .95rem; }

  .grid {
    display: grid; gap: 22px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 7px;
    overflow: hidden; cursor: pointer;
    display: flex; flex-direction: column;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: 0 18px 32px -22px rgba(0,0,0,.9); }
  .card:focus-visible { outline: 3px solid var(--gold-line); outline-offset: 2px; }
  .thumb {
    aspect-ratio: 4 / 5; background: var(--plate);
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--line); overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .noimg { border: 0; aspect-ratio: auto; height: 100%; width: 100%; }
  .card-body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-title { font: 400 1.25rem/1.2 var(--serif); margin: 0; color: #fff; }
  .card-autor { font: italic 400 1rem var(--serif); color: var(--muted); margin: 0 0 10px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
    background: var(--seal-bg); color: var(--seal); border: 1px solid rgba(16,200,155,.3);
  }
  .card-id {
    margin-top: auto; font: 600 .82rem var(--sans);
    letter-spacing: .14em; color: var(--muted);
    font-variant-numeric: tabular-nums; word-break: break-all;
  }
  .card-link {
    display: inline-block; margin-top: 8px;
    font: 500 .85rem var(--sans); color: #e4aa35;
    text-decoration: none;
  }
  .card-link:hover { text-decoration: underline; }

  /* --- Estados --- */
  .state { text-align: center; padding: 56px 20px; background: var(--paper); border: 1px solid var(--line); border-radius: 7px; }
  .state h2 { font: 400 1.7rem var(--serif); margin: 0 0 8px; color: #fff; }
  .state p { margin: 0 auto; max-width: 44ch; color: var(--muted); }
  .state.error h2 { color: var(--error); }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line-strong); border-top-color: var(--gold-line); margin: 0 auto 14px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .card { transition: none; } }

  [hidden] { display: none !important; }

  @media (max-width: 1150px) {
    .sidebar { width: 78px; padding: 16px 8px; align-items: center; }
    .side-brand { width: 48px; padding: 0; justify-content: center; }
    .side-brand img { max-height: 40px; object-position: center; }
    .nav { align-items: stretch; width: 100%; }
    .nav a { flex-direction: column; gap: 3px; padding: 7px 3px; min-height: 0; border-left: 0; }
    .nav a span.txt { font-size: 9px; text-align: center; line-height: 1.15; }
    .nav a[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--gold); }
  }

  @media (max-width: 760px) {
    .sidebar { display: none; }
    .top-brand { display: block; width: 100%; text-align: center; }
    .certificate { grid-template-columns: 1fr; }
    .plate { border-right: 0; border-bottom: 1px solid var(--line); padding: 18px; }
    .label { padding: 24px 20px; }
    dl div { grid-template-columns: 96px 1fr; }
    .search { min-width: 0; }
  }

  @media print {
    body { background: #fff; color: #000; display: block; }
    .sidebar { display: none !important; }
    main { padding: 0; }
    .search, .topbar, .catalog-head { display: none !important; }
    .certificate { box-shadow: none; border-color: #999; background: #fff; color: #000; }
    h1, .autor, dd, .id { color: #000; }
    .plate { background: #f3f5f6; }
  }
</style>
</head>
<body>

  <nav class="nav">

<div class="content">
<main>
  <div class="topbar">
    <div class="top-brand"><img src="logo-large-s.png" alt="RTBROK"></div>
    <form class="search" id="form" role="search">
      <input id="idInput" type="text" inputmode="text" autocomplete="off" spellcheck="false"
             maxlength="16" placeholder="Ingresa el ID del certificado" aria-label="ID del certificado">

<script>
(function () {
  // ====== CONFIGURACIÓN ======
  const API_URL = "https://script.google.com/macros/s/AKfycbxhfk9X86NZY6nhPzjiQtmUUoglYv1q5sZcEudiOc1QjT8P-25N0umBRyr2QwhcThR4JA/exec";
  const UNIDAD = "cm";
  const ID_REGEX = /^[A-Z0-9]{16}$/;
  // ===========================

  const out = document.getElementById("out");
  const form = document.getElementById("form");
  const input = document.getElementById("idInput");
  const catalogSection = document.getElementById("catalogSection");
  const catalogEl = document.getElementById("catalog");
  const catalogCount = document.getElementById("catalogCount");

  // ---------- Utilidades DOM ----------
  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(c => c && n.appendChild(c));
    return n;
  }
  function show(node) { out.replaceChildren(node); }
  function showState(kind, title, text) {
    show(el("div", { class: "state " + (kind || "") }, [
      el("h2", { text: title }),
      text ? el("p", { text }) : null
    ]));
  }
  function spinner(text) {
    return el("div", { class: "state" }, [
      el("div", { class: "spinner" }),
      el("p", { text: text || "Cargando…" })
    ]);
  }

  function getIdFromUrl() {
    const qp = new URLSearchParams(location.search).get("id");
    if (qp) return qp.trim().toUpperCase();
    const last = location.pathname.split("/").filter(Boolean).pop() || "";
    const clean = last.replace(/\.html?$/i, "").toUpperCase();
    return ID_REGEX.test(clean) ? clean : "";
  }

  function fmt(v) { return (v === null || v === undefined) ? "" : String(v).trim(); }

  function medidas(d) {
    const partes = [];
    const alto = fmt(d.alto), ancho = fmt(d.ancho), prof = fmt(d.profundo);
    if (alto) partes.push(alto);
    if (ancho) partes.push(ancho);
    if (prof && prof !== "0") partes.push(prof);
    if (!partes.length) return "";
    return partes.join(" × ") + " " + UNIDAD + (partes.length > 1 ? " (alto × ancho" + (partes.length > 2 ? " × profundo)" : ")") : "");
  }

  function row(dt, dd) {
    if (!dd) return null;
    return el("div", null, [el("dt", { text: dt }), el("dd", { text: dd })]);
  }

  function checkIcon() {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", "34"); svg.setAttribute("height", "34");
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "2");
    svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = '<path d="M12 2l2.4 2 3.1-.2 1 3 2.6 1.8-.9 3 .9 3-2.6 1.8-1 3-3.1-.2L12 22l-2.4-2-3.1.2-1-3L2.9 15.4l.9-3-.9-3L5.5 7.6l1-3 3.1.2z"/><path d="M8.5 12.2l2.4 2.4 4.6-4.9"/>';
    return svg;
  }

  // ---------- Render certificado individual ----------
  function renderCertificate(d) {
    const plate = el("div", { class: "plate" });
    if (d.imagen) {
      const img = el("img", { src: d.imagen + "=w1200", alt: "Imagen de la obra " + fmt(d.nombreObra), referrerpolicy: "no-referrer" });
      img.addEventListener("error", function () {
        plate.replaceChildren(el("div", { class: "noimg", text: "No se pudo cargar la imagen de la obra." }));
      });
      plate.appendChild(el("figure", null, [img]));
    } else {
      plate.appendChild(el("div", { class: "noimg", text: "Esta obra no tiene imagen." }));
    }

    const lista = el("dl", null, [
      row("Serie", fmt(d.serie)),
      row("Categoría", fmt(d.categoria)),
      row("Soporte", fmt(d.soporte)),
      row("Medidas", medidas(d))
    ]);

    const seal = el("div", { class: "seal" }, [
      el("div", { class: "seal-box" }, [
        checkIcon(),
        el("div", null, [
          el("strong", { text: "Certificado verificado" }),
          el("span", { class: "id", text: fmt(d.id) })
        ])
      ])
    ]);

    const label = el("div", { class: "label" }, [
      el("p", { class: "kicker", text: "Certificado de autenticidad" }),
      el("h1", { text: fmt(d.nombreObra) || "Obra sin título" }),
      el("p", { class: "autor", text: fmt(d.autor) }),
      lista,
      seal
    ]);

    show(el("article", { class: "certificate" }, [plate, label]));
    document.title = (fmt(d.nombreObra) || "Certificado") + " · Certificado RTBROK";
  }

  // ---------- Buscar certificado individual ----------
  async function buscar(id) {
    id = (id || "").trim().toUpperCase();
    input.value = id;

    if (!id) {
      showState("", "Verifica una obra", "Escribe el ID de 16 caracteres que aparece en tu certificado o consulta el registro completo abajo.");
      return;
    }
    if (!ID_REGEX.test(id)) {
      showState("error", "ID no válido", "El ID tiene 16 caracteres, solo letras y números. Revisa que esté completo.");
      return;
    }

    show(spinner("Buscando certificado…"));

    try {
      const res = await fetch(API_URL + "?id=" + encodeURIComponent(id), { redirect: "follow" });
      const txt = await res.text();
      let data = null;
      try { data = txt ? JSON.parse(txt) : null; } catch (_) {}

      if (data && data.ok) {
        renderCertificate(data);
      } else {
        showState("error", "Certificado no encontrado", "No hay ninguna obra registrada con el ID " + id + ". Verifica que esté escrito correctamente.");
      }
    } catch (err) {
      showState("error", "No se pudo consultar", "Revisa tu conexión e inténtalo de nuevo en unos segundos.");
    }
  }

  // ---------- Catálogo público (JSONP) ----------
  function jsonp(url, params) {
    return new Promise((resolve, reject) => {
      const cbName = "rtbCertificadosCallback_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");
      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error("Tiempo de espera agotado"));
      }, 20000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = function (data) {
        cleanup();
        resolve(data);
      };
      script.onerror = function () {
        cleanup();
        reject(new Error("Error de red"));
      };

      const q = new URLSearchParams(Object.assign({}, params, { callback: cbName }));
      script.src = url + "?" + q.toString();
      document.body.appendChild(script);
    });
  }

  function cardCertificado(c) {
    const thumb = el("div", { class: "thumb" });
    if (c.imagen) {
      const img = el("img", { src: c.imagen + "=w600", alt: "Imagen de la obra " + fmt(c.nombreObra), loading: "lazy", referrerpolicy: "no-referrer" });
      img.addEventListener("error", function () {
        thumb.replaceChildren(el("div", { class: "noimg", text: "Sin imagen" }));
      });
      thumb.appendChild(img);
    } else {
      thumb.appendChild(el("div", { class: "noimg", text: "Sin imagen" }));
    }

    const chips = el("div", { class: "card-meta" });
    if (c.categoria) chips.appendChild(el("span", { class: "chip", text: c.categoria }));
    if (c.soporte && c.soporte !== "desconocido") chips.appendChild(el("span", { class: "chip", text: c.soporte }));

    const body = el("div", { class: "card-body" }, [
      el("h3", { class: "card-title", text: fmt(c.nombreObra) || "Obra sin título" }),
      el("p", { class: "card-autor", text: fmt(c.autor) || "Autor no especificado" }),
      chips,
      el("span", { class: "card-id", text: fmt(c.id) })
    ]);

    const card = el("div", {
      class: "card",
      role: "button",
      tabindex: "0",
      "aria-label": "Ver certificado " + fmt(c.id)
    }, [thumb, body]);

    function open() {
      try { history.replaceState(null, "", "?id=" + c.id); } catch (_) {}
      buscar(c.id);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    card.addEventListener("click", open);
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
    });

    return card;
  }

  async function cargarCatalogo() {
    catalogSection.hidden = false;
    catalogEl.replaceChildren(spinner("Cargando registro de obras…"));
    catalogCount.textContent = "";

    try {
      const data = await jsonp(API_URL, { action: "list" });

      if (!data || !data.ok) {
        throw new Error((data && data.message) || "Respuesta no válida");
      }

      const lista = Array.isArray(data.certificados) ? data.certificados : [];
      catalogCount.textContent = lista.length === 1
        ? "1 obra registrada"
        : lista.length + " obras registradas";

      if (!lista.length) {
        catalogEl.replaceChildren(
          el("div", { class: "state", style: "grid-column:1/-1" }, [
            el("h2", { text: "Aún no hay obras registradas" }),
            el("p", { text: "Cuando se emita el primer certificado aparecerá aquí automáticamente." })
          ])
        );
        return;
      }

      const frag = document.createDocumentFragment();
      lista.forEach(c => frag.appendChild(cardCertificado(c)));
      catalogEl.replaceChildren(frag);

    } catch (err) {
      catalogCount.textContent = "";
      catalogEl.replaceChildren(
        el("div", { class: "state error", style: "grid-column:1/-1" }, [
          el("h2", { text: "No se pudo cargar el registro" }),
          el("p", { text: "Revisa tu conexión e inténtalo de nuevo en unos segundos." })
        ])
      );
    }
  }

  // ---------- Eventos ----------
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const id = input.value.trim().toUpperCase();
    if (ID_REGEX.test(id)) {
      try { history.replaceState(null, "", "?id=" + id); } catch (_) {}
    }
    buscar(id);
  });

  // ---------- Arranque ----------
  const idInicial = getIdFromUrl();
  if (idInicial) {
    buscar(idInicial);
  } else {
    showState("", "Verifica una obra", "Escribe el ID de 16 caracteres que aparece en tu certificado o consulta el registro completo abajo.");
  }
  cargarCatalogo();
})();
</script>
</body>
</html>
